<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>ROM Organizer Pro - Logs</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/static/css/custom.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container py-5">
      <div class="card p-4 shadow-lg">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h1 class="mb-1">📄 Log Viewer</h1>
            <p class="text-muted mb-0">
              View the full application log history for ROM Organizer Pro.
            </p>
          </div>
          <div class="d-flex gap-2">
            <a href="/" class="btn btn-secondary">Back to Home</a>
            <button class="btn btn-primary" onclick="location.reload()">
              Refresh
            </button>
          </div>
        </div>

        <div class="mb-4">
          <div class="badge bg-info text-dark">
            {{ log.split('\n')|length }} lines
          </div>
          <span class="ms-2 text-muted">Last updated when page loaded.</span>
        </div>

        <div
          class="bg-dark text-light p-3 rounded"
          style="
            min-height: 60vh;
            white-space: pre-wrap;
            font-family: monospace;
            overflow-x: auto;
          "
        >
          {{ log }}
        </div>
      </div>
    </div>
  </body>
</html>
